name: Build and Deploy to EKS

on:
  push:
    branches:
      - main  # Triggers the pipeline on code commits to main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: musical-volunteer
  EKS_CLUSTER_NAME: secureguard-cluster
  HELM_RELEASE_NAME: python-app-release

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. Checkout the source code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate securely with AWS using GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Log into AWS Elastic Container Registry (ECR)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build, tag, and push Docker image to ECR
      - name: Build, Tag, and Push Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 5. Connect to your EKS Cluster by updating the kubeconfig context
      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      # 6. Install Helm CLI on the pipeline runner
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # 7. Execute the Upgrade using the new image tag dynamically
      - name: Deploy Chart to EKS via Helm
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ./charts/musical-volunteer \
            --namespace dev \
            --create-namespace \
            --set image.repository=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }} \
            --set image.tag=${{ steps.build-image.outputs.image_tag }}
